[target.xtensa-esp32-none-elf]
runner = "espflash flash --monitor -f 80mhz -B 3000000 -T table.csv -L defmt"
#runner = "probe-rs download --chip=esp32 --speed 26000"

[env]
DEFMT_LOG="info"
ESP_HAL_CONFIG_PLACE_SPI_DRIVER_IN_RAM="true"
ESP_HAL_CONFIG_XTAL_FREQUENCY="40"

[build]
rustflags = [
  "-C", "link-arg=-nostartfiles","-Z", "stack-protector=all"
]


target = "xtensa-esp32-none-elf"

[unstable]
build-std = ["alloc", "core"]
